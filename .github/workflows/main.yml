name: Android ZIP Auto Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'

    - name: Extract Project ZIP
      run: |
        unzip -o guardian_core_flutter_project.zip -d extracted_project
        cd extracted_project
        if [ -f pubspec.yaml ]; then
          mv * .. 2>/dev/null || true
          mv .[a-zA-Z0-9]* .. 2>/dev/null || true
        else
          sub_dir=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
          if [ ! -z "$sub_dir" ]; then
            mv $sub_dir/* .. 2>/dev/null || true
            mv $sub_dir/.[a-zA-Z0-9]* .. 2>/dev/null || true
          fi
        fi
        cd ..
        rm -rf extracted_project guardian_core_flutter_project.zip

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Android APK
      run: flutter build apk --release --split-per-abi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: guardian-core-apk
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
